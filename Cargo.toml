[package]
name = "kaku-tui"
version = "0.1.0"
edition = "2021"

[lib]
name = "kaku_tui_lib"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
tui-textarea = "0.7"
